syntax = "proto3";
package im;
option go_package = "im-service/proto";

message SendMessageRequest {
  string token = 1;
  int64 conversation_id = 2;
  string content = 3;
}

message SendMessageResponse {
  int64 message_id = 1;
  int64 created_at = 2;
}

message SyncRequest {
  string token = 1;
  int64 last_sync_at = 2;
  int32 limit = 3;
}

message ConversationState {
  int64 conversation_id = 1;
  string type = 2;
  int64 last_msg_id = 3;
  int32 unread_count = 4;
  int64 updated_at = 5;
  string name = 6;
  string last_msg_content = 7;
  string last_msg_from = 8;
}

message MessageItem {
  int64 id = 1;
  int64 conversation_id = 2;
  int64 from_id = 3;
  string from_username = 4;
  string content = 5;
  int64 created_at = 6;
}

message SyncResponse {
  repeated ConversationState conversations = 1;
  repeated MessageItem messages = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 user_id = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  int64 user_id = 1;
  string token = 2;
}

message CreateGroupRequest {
  string token = 1;
  string name = 2;
  repeated int64 member_ids = 3;
}

message CreateGroupResponse {
  int64 group_id = 1;
  int64 conversation_id = 2;
}

message CreateDMRequest {
  string token = 1;
  int64 peer_id = 2;
}

message CreateDMResponse {
  int64 conversation_id = 1;
}

message PushRequest {
  int64 user_id = 1;
  bytes payload = 2;
}

message PushResponse {}

message MarkReadRequest {
  string token = 1;
  int64 conversation_id = 2;
  int64 msg_id = 3;
}

message MarkReadResponse {}

message ListUsersRequest {
  string token = 1;
}

message UserItem {
  int64 id = 1;
  string username = 2;
}

message ListUsersResponse {
  repeated UserItem users = 1;
}

service LogicService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc Sync(SyncRequest) returns (SyncResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc CreateDM(CreateDMRequest) returns (CreateDMResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc SendFriendRequest(SendFriendRequestReq) returns (SendFriendRequestResp);
  rpc HandleFriendRequest(HandleFriendRequestReq) returns (HandleFriendRequestResp);
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  rpc ListFriendRequests(ListFriendRequestsRequest) returns (ListFriendRequestsResponse);
  rpc GetInviteCode(GetInviteCodeRequest) returns (GetInviteCodeResponse);
  rpc RefreshInviteCode(GetInviteCodeRequest) returns (GetInviteCodeResponse);
  rpc AddFriendByCode(AddFriendByCodeRequest) returns (AddFriendByCodeResponse);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);
}

message KickRequest {
  int64 user_id = 1;
}

message KickResponse {}

message SendFriendRequestReq {
  string token = 1;
  int64 to_id = 2;
}

message SendFriendRequestResp {}

message HandleFriendRequestReq {
  string token = 1;
  int64 request_id = 2;
  bool accept = 3;
}

message HandleFriendRequestResp {}

message ListFriendsRequest {
  string token = 1;
}

message ListFriendsResponse {
  repeated UserItem friends = 1;
}

message FriendRequestItem {
  int64 id = 1;
  int64 from_id = 2;
  string from_username = 3;
  string status = 4;
  int64 created_at = 5;
}

message ListFriendRequestsRequest {
  string token = 1;
}

message ListFriendRequestsResponse {
  repeated FriendRequestItem requests = 1;
}

message GetInviteCodeRequest {
  string token = 1;
}

message GetInviteCodeResponse {
  string code = 1;
}

message AddFriendByCodeRequest {
  string token = 1;
  string code = 2;
}

message AddFriendByCodeResponse {
  string username = 1;
}

message GetMessagesRequest {
  string token = 1;
  int64 conversation_id = 2;
  int64 before_id = 3;
  int32 limit = 4;
}

message GetMessagesResponse {
  repeated MessageItem messages = 1;
}

service GatewayService {
  rpc Push(PushRequest) returns (PushResponse);
  rpc Kick(KickRequest) returns (KickResponse);
}
