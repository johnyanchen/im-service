<h2>IM 主界面布局方案</h2>
<p class="subtitle">选择一个你喜欢的整体布局风格</p>

<div class="cards">
  <div class="card" data-choice="a" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 16px; background: #f8f9fa;">
      <div style="display:flex; height:280px; border-radius:8px; overflow:hidden; border:1px solid #e0e0e0;">
        <!-- 左侧边栏 -->
        <div style="width:70px; background:#2c2c2c; display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:12px;">
          <div style="width:36px;height:36px;border-radius:50%;background:#5865F2;"></div>
          <div style="width:36px;height:36px;border-radius:50%;background:#3ba55c;"></div>
          <div style="width:36px;height:36px;border-radius:50%;background:#faa61a;"></div>
          <div style="width:36px;height:36px;border-radius:50%;background:#ed4245;"></div>
        </div>
        <!-- 会话列表 -->
        <div style="width:200px; background:#f2f3f5; padding:12px;">
          <div style="height:32px;background:#fff;border-radius:6px;margin-bottom:10px;"></div>
          <div style="height:48px;background:#e3e5e8;border-radius:6px;margin-bottom:6px;"></div>
          <div style="height:48px;background:#fff;border-radius:6px;margin-bottom:6px;border:2px solid #5865F2;"></div>
          <div style="height:48px;background:#fff;border-radius:6px;margin-bottom:6px;"></div>
          <div style="height:48px;background:#fff;border-radius:6px;"></div>
        </div>
        <!-- 聊天区 -->
        <div style="flex:1; background:#fff; padding:12px; display:flex; flex-direction:column;">
          <div style="height:36px;border-bottom:1px solid #e0e0e0;margin-bottom:12px;"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
            <div style="align-self:flex-start;background:#f2f3f5;border-radius:12px;padding:8px 14px;max-width:60%;height:28px;"></div>
            <div style="align-self:flex-end;background:#5865F2;border-radius:12px;padding:8px 14px;max-width:60%;height:28px;"></div>
            <div style="align-self:flex-start;background:#f2f3f5;border-radius:12px;padding:8px 14px;max-width:45%;height:28px;"></div>
          </div>
          <div style="height:40px;background:#f2f3f5;border-radius:20px;margin-top:12px;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>A. 三栏布局（类 Discord）</h3>
      <p>左侧 icon 导航 + 会话列表 + 聊天区。适合功能多、有多个空间/频道的场景。</p>
    </div>
  </div>

  <div class="card" data-choice="b" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 16px; background: #f8f9fa;">
      <div style="display:flex; height:280px; border-radius:8px; overflow:hidden; border:1px solid #e0e0e0;">
        <!-- 会话列表 -->
        <div style="width:260px; background:#fff; padding:12px; border-right:1px solid #e0e0e0;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
            <div style="width:32px;height:32px;border-radius:50%;background:#07c160;"></div>
            <div style="flex:1;height:14px;background:#f0f0f0;border-radius:4px;"></div>
          </div>
          <div style="display:flex;gap:8px;margin-bottom:12px;">
            <div style="flex:1;height:28px;background:#f2f3f5;border-radius:14px;text-align:center;line-height:28px;font-size:11px;color:#666;">💬 会话</div>
            <div style="flex:1;height:28px;background:#fff;border-radius:14px;text-align:center;line-height:28px;font-size:11px;color:#999;border:1px solid #e0e0e0;">👥 联系人</div>
          </div>
          <div style="height:52px;background:#e8f5e9;border-radius:8px;margin-bottom:6px;border-left:3px solid #07c160;"></div>
          <div style="height:52px;background:#f8f9fa;border-radius:8px;margin-bottom:6px;"></div>
          <div style="height:52px;background:#f8f9fa;border-radius:8px;margin-bottom:6px;"></div>
          <div style="height:52px;background:#f8f9fa;border-radius:8px;"></div>
        </div>
        <!-- 聊天区 -->
        <div style="flex:1; background:#f0f2f5; padding:12px; display:flex; flex-direction:column;">
          <div style="height:36px;background:#fff;border-radius:6px;margin-bottom:12px;padding:8px;"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
            <div style="align-self:flex-start;background:#fff;border-radius:12px;padding:8px 14px;max-width:60%;height:28px;"></div>
            <div style="align-self:flex-end;background:#07c160;border-radius:12px;padding:8px 14px;max-width:60%;height:28px;"></div>
            <div style="align-self:flex-start;background:#fff;border-radius:12px;padding:8px 14px;max-width:50%;height:28px;"></div>
          </div>
          <div style="height:40px;background:#fff;border-radius:20px;margin-top:12px;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B. 双栏布局（类微信 Web）</h3>
      <p>左侧会话列表（带 tab 切换联系人）+ 右侧聊天区。简洁直观，适合社交聊天。</p>
    </div>
  </div>

  <div class="card" data-choice="c" onclick="toggleSelect(this)">
    <div class="card-image" style="padding: 16px; background: #f8f9fa;">
      <div style="display:flex; height:280px; border-radius:8px; overflow:hidden; border:1px solid #e0e0e0;">
        <!-- 会话列表 -->
        <div style="width:240px; background:#17212b; padding:12px;">
          <div style="height:32px;background:#242f3d;border-radius:16px;margin-bottom:12px;"></div>
          <div style="height:48px;background:#2b5278;border-radius:8px;margin-bottom:4px;"></div>
          <div style="height:48px;background:#1e2c3a;border-radius:8px;margin-bottom:4px;"></div>
          <div style="height:48px;background:#1e2c3a;border-radius:8px;margin-bottom:4px;"></div>
          <div style="height:48px;background:#1e2c3a;border-radius:8px;margin-bottom:4px;"></div>
          <div style="height:48px;background:#1e2c3a;border-radius:8px;"></div>
        </div>
        <!-- 聊天区 -->
        <div style="flex:1; background:#0e1621; padding:12px; display:flex; flex-direction:column;">
          <div style="height:36px;border-bottom:1px solid #17212b;margin-bottom:12px;"></div>
          <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
            <div style="align-self:flex-start;background:#182533;border-radius:12px;padding:8px 14px;max-width:60%;height:28px;"></div>
            <div style="align-self:flex-end;background:#2b5278;border-radius:12px;padding:8px 14px;max-width:60%;height:28px;"></div>
            <div style="align-self:flex-start;background:#182533;border-radius:12px;padding:8px 14px;max-width:45%;height:28px;"></div>
          </div>
          <div style="height:40px;background:#17212b;border-radius:20px;margin-top:12px;"></div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C. 双栏暗色（类 Telegram Desktop）</h3>
      <p>同样双栏，但默认暗色主题。现代感强，护眼，适合开发者群体。</p>
    </div>
  </div>
</div>
